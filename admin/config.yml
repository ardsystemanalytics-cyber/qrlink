# build: force-refresh cache
backend:
  name: github
  repo: ardsystemanalytics-cyber/qrlink
  branch: main
  # Vlastný prihlasovací mostík (GitHub OAuth cez malé serverless funkcie
  # v priečinku /api – potrebné, lebo hostujeme na Verceli, nie na Netlify).
  # Ak sa produkčná doména zmení, uprav aj túto hodnotu.
  base_url: https://qrlink-six.vercel.app
  auth_endpoint: api/auth

# Len pre lokálne testovanie (http://localhost): CMS potom číta/zapisuje súbory
# priamo z disku cez "npx decap-server" namiesto GitHubu. Na produkcii sa
# toto nastavenie ignoruje (aktivuje sa iba na localhost).
local_backend: true

# Po uložení v CMS commitne priamo do vetvy "main" -> Vercel to hneď nasadí.
# (Redakčný "editorial workflow" so schvaľovaním sme vedome vypli.)
publish_mode: simple

# Všetky fotky webu sú v JEDNOM priečinku – CMS ich tak vie zobraziť (náhľady
# v zozname aj vo formulári), v záložke "Media" ponúkne na výber všetky
# existujúce fotky a nové nahraté fotky uloží k nim. (Decap hľadá obrázok
# vždy v media_folder podľa názvu súboru – preto to nemôže byť viac priečinkov.)
# Cesta sa ukladá bez úvodného "/" rovnako ako pri existujúcich fotkách;
# build-data.js ju pre web normalizuje na "/assets/...".
media_folder: "assets/images/migrated"
public_folder: "assets/images/migrated"

locale: "en"

collections:
  - name: kategorie
    label: "Kategórie"
    label_singular: "Kategória"
    description: "Hlavné kategórie projektov (Mestá, Pamiatky, Náučné chodníky…). Zobrazujú sa na hlavnej stránke."
    folder: "content/kategorie"
    create: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    identifier_field: nazov
    fields:
      - { label: "ID (nemeniť po vytvorení)", name: "id", widget: "string", hint: "Krátky identifikátor bez diakritiky a medzier, napr. 'mesta'. Musí byť rovnaký ako názov súboru." }
      - { label: "Poradie zobrazenia", name: "poradie", widget: "number", value_type: "int", hint: "Nižšie číslo = zobrazí sa skôr." }
      - { label: "Názov (slovensky)", name: "nazov", widget: "string" }
      - { label: "Farba", name: "farba", widget: "color", allow_input: true, enable_alpha: false }
      - label: "Preklady"
        name: "i18n"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Angličtina"
            name: "en"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
          - label: "Čeština"
            name: "cs"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
          - label: "Maďarčina"
            name: "hu"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
          - label: "Nemčina"
            name: "de"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }

  - name: miesta
    # Interný názov kolekcie ostáva "miesta" (priečinok content/miesta,
    # odkazy v dátach); v rozhraní /admin sa volá "Projekty".
    label: "Projekty"
    label_singular: "Projekt"
    description: "Mestá, pamiatky, náučné chodníky a ich podkategórie/trasy. Hlavný projekt má vyplnenú 'Hlavnú kategóriu' a súradnice; podkategória/trasa má namiesto toho vyplnený nadradený projekt."
    folder: "content/miesta"
    create: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    identifier_field: nazov
    # Pekné URL (napr. "/category/betliar/") sa počítajú z "povodnaUrl" pri
    # builde (scripts/build-data.js) - nedajú sa vyjadriť jednoduchou šablónou
    # tu (nepravidelná, ľubovoľne vnorená štruktúra prevzatá zo starého webu),
    # preto náhľad vedie na vždy funkčnú internú adresu s ?id=.
    preview_path: "kategoria.html?id={{id}}"
    # V /admin sa pri Projektoch objaví rozbaľovacie "Group by" – zoznam si
    # vieš rozdeliť buď podľa hlavnej kategórie, alebo podľa toho, pod
    # ktorý (hlavný) projekt podkategórie/trasy patria.
    view_groups:
      - label: "Hlavná kategória"
        field: hlavnaKategoria
      - label: "Projekt"
        field: korenoveMiesto
    # Karta v zozname: názov, pod ním kam projekt/podkategória patrí ("cesta" – dopočítava
    # scripts/backfill-miesta-helpers.js) a titulná fotka.
    summary: "{{nazov}}\n{{cesta}}"
    sortable_fields:
      - { field: "nazov", label: "Názov", default_sort: true }
      - { field: "poradie", label: "Poradie na webe" }
    fields:
      - { label: "Názov (slovensky)", name: "nazov", widget: "string" }
      - { label: "Titulná fotka", name: "cover", widget: "image", required: false, hint: "Fotka na karte projektu, v hlavičke jeho stránky aj tu v zozname. Ak ostane prázdna, použije sa fotka nadradeného projektu. Nahraná fotka sa automaticky zmenší na max. 400 KB." }
      - { label: "Titulná fotka je erb / logo (zobraziť celú, neorezať)", name: "fotoErb", widget: "boolean", required: false, default: false }
      - { label: "Popis (slovensky)", name: "popis", widget: "text", required: false }

      - label: "① Toto je podkategória/trasa? → vyber jej nadradený projekt"
        name: "rodic"
        widget: "relation"
        collection: "miesta"
        value_field: "id"
        search_fields: ["nazov", "id"]
        display_fields: ["nazov", "id"]
        required: false
        hint: "Vyplň LEN ak je toto podkategória/trasa patriaca pod iný projekt (alebo inú podkategóriu). Ak toto vyplníš, polia nižšie (Hlavná kategória, Všetky kategórie, súradnice) nechaj prázdne – nepoužijú sa, kategóriu aj farbu/ikonu táto podkategória zdedí od nadradeného projektu."
      - label: "② Alebo je toto samostatný hlavný projekt? → vyplň jeho kategóriu a polohu"
        name: "primarna"
        widget: "relation"
        collection: "kategorie"
        value_field: "id"
        search_fields: ["nazov", "id"]
        display_fields: ["nazov"]
        required: false
        hint: "Vyplň LEN ak si vyššie NEVYBRALA/VYBRAL nadradený projekt (teda toto je samostatný hlavný projekt, nie podkategória)."
      - label: "Všetky kategórie"
        name: "kategorie"
        widget: "relation"
        collection: "kategorie"
        value_field: "id"
        search_fields: ["nazov", "id"]
        display_fields: ["nazov"]
        multiple: true
        required: false
        hint: "Vyplniť LEN pre hlavný projekt (pozri ②) – do ktorých kategórií ešte patrí (okrem hlavnej)."
      - { label: "Zemepisná dĺžka (lon)", name: "lon", widget: "number", value_type: "float", required: false, hint: "Vyplniť LEN pre hlavný projekt (pozri ②) – súradnica na mape." }
      - { label: "Zemepisná šírka (lat)", name: "lat", widget: "number", value_type: "float", required: false, hint: "Vyplniť LEN pre hlavný projekt (pozri ②) – súradnica na mape." }
      - { label: "Pozícia X na ilustračnej mape (px)", name: "mapX", widget: "number", value_type: "int", required: false, hint: "Vyplniť LEN pre hlavný projekt (pozri ②)." }
      - { label: "Pozícia Y na ilustračnej mape (px)", name: "mapY", widget: "number", value_type: "int", required: false, hint: "Vyplniť LEN pre hlavný projekt (pozri ②)." }

      - label: "Zvýraznená zaujímavosť (voliteľné)"
        name: "heroOverlay"
        widget: "object"
        required: false
        collapsed: true
        hint: "Malá 'vedeli ste že...' bublina na stránke projektu."
        fields:
          - { label: "Ikonka", name: "icon", widget: "select", options: ["hrad", "stromy", "ludia", "qr"], required: false }
          - { label: "Nadpis (napr. 'Zaujímavosť')", name: "text", widget: "string", required: false }
          - { label: "Text", name: "popis", widget: "text", required: false }
          - label: "Preklady"
            name: "i18n"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - label: "Angličtina"
                name: "en"
                widget: "object"
                required: false
                fields:
                  - { label: "Nadpis", name: "text", widget: "string", required: false }
                  - { label: "Text", name: "popis", widget: "text", required: false }
              - label: "Čeština"
                name: "cs"
                widget: "object"
                required: false
                fields:
                  - { label: "Nadpis", name: "text", widget: "string", required: false }
                  - { label: "Text", name: "popis", widget: "text", required: false }
              - label: "Maďarčina"
                name: "hu"
                widget: "object"
                required: false
                fields:
                  - { label: "Nadpis", name: "text", widget: "string", required: false }
                  - { label: "Text", name: "popis", widget: "text", required: false }
              - label: "Nemčina"
                name: "de"
                widget: "object"
                required: false
                fields:
                  - { label: "Nadpis", name: "text", widget: "string", required: false }
                  - { label: "Text", name: "popis", widget: "text", required: false }

      - label: "SEO (voliteľné)"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        hint: "Ak nevyplníš, použije sa automaticky názov/popis/fotka projektu."
        fields:
          - { label: "SEO titulok", name: "title", widget: "string", required: false }
          - { label: "SEO popis", name: "description", widget: "text", required: false }
          - { label: "SEO obrázok (zdieľanie na sociálnych sieťach)", name: "image", widget: "image", required: false }

      - label: "Preklady obsahu"
        name: "i18n"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Angličtina"
            name: "en"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
          - label: "Čeština"
            name: "cs"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
          - label: "Maďarčina"
            name: "hu"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
          - label: "Nemčina"
            name: "de"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }

      - { label: "Technické: poradie na hlavnej stránke", name: "poradie", widget: "number", value_type: "int", hint: "Nižšie číslo = zobrazí sa skôr na hlavnej stránke." }
      - { label: "Technické: ID (vyplniť len pri novom projekte, potom nemeniť)", name: "id", widget: "string", hint: "Krátky identifikátor bez diakritiky a medzier, napr. 'hrad-lietava'. Musí byť rovnaký ako názov súboru." }

  - name: zastavenia
    label: "Zastavenia"
    label_singular: "Zastavenie"
    description: "Jednotlivé zastávky s QR kódom v rámci projektu/trasy (napr. izby na hrade, jednotlivé body na náučnom chodníku)."
    folder: "content/zastavenia"
    create: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    # Pozri poznámku pri "preview_path" v kolekcii "miesta" vyššie - rovnaký dôvod.
    preview_path: "zastavenie.html?id={{id}}"
    identifier_field: nazov
    # Predvolené zoradenie v zozname (aj v rámci skupín nižšie) –
    # rovnaké poradie, v akom sa zastavenia zobrazujú na webe.
    sortable_fields:
      - { field: "nazov", label: "Názov", default_sort: true }
      - { field: "poradie", label: "Poradie v rámci projektu" }
    # Karta v zozname: názov, pod ním celá cesta, kam zastavenie patrí
    # ("cesta" – dopočítava scripts/backfill-zastavenia-helpers.js) a titulná fotka.
    summary: "{{nazov}}\nPodkategória: {{cesta}}"
    # V /admin sa pri Zastaveniach objaví rozbaľovacie "Group by" –
    # zvolíš si, či chceš zoznam rozdelený podľa hlavnej kategórie,
    # alebo podľa celého projektu (všetky jeho podkategórie/trasy
    # spolu, nech je akokoľvek hlboko vnorené). "Group by: Miesto" sme
    # zámerne vynechali – pri drvivej väčšine projektov by len
    # zdvojovalo "Projekt" (jedno miesto = jeden projekt).
    #
    # POZOR – obmedzenie Decap CMS: skupiny (aj poradie zastavení v rámci
    # skupiny "Projekt") sa NEDAJÚ zoradiť tak, aby presne kopírovali
    # poradie podkategórií na webe – to Decap CMS neponúka (potvrdené,
    # nie je to prehliadnutá možnosť). V rámci JEDNEJ skupiny si ale
    # vieš zapnúť triedenie "Sort by: Poradie" hore v zozname, nech
    # aspoň zastavenia idú v správnom poradí.
    view_groups:
      - label: "Hlavná kategória"
        field: hlavnaKategoria
      - label: "Projekt"
        field: projekt
    fields:
      - { label: "Názov (slovensky)", name: "nazov", widget: "string" }
      - { label: "Titulná fotka", name: "cover", widget: "image", required: false, hint: "Hlavná fotka zastavenia – zobrazí sa hore na jeho stránke, ako prvá vo fotogalérii aj tu v zozname. Nahraná fotka sa automaticky zmenší na max. 400 KB." }
      - label: "Patrí do projektu / podkategórie"
        name: "miesto"
        widget: "relation"
        collection: "miesta"
        value_field: "id"
        search_fields: ["nazov", "id"]
        display_fields: ["nazov", "cesta"]
        hint: "Ku ktorému projektu/podkategórii/trase toto zastavenie patrí (vyhľadaj podľa názvu)."
      - { label: "Poradie v rámci projektu", name: "poradie", widget: "number", value_type: "int", hint: "Nižšie číslo = zobrazí sa skôr." }
      - { label: "Krátky popis (slovensky)", name: "popis", widget: "text", required: false }
      - label: "Text zastavenia (slovensky)"
        name: "text"
        widget: "markdown"
        required: false
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: []
      - label: "Audio nahrávky"
        name: "audio"
        widget: "list"
        required: false
        field: { label: "Audio súbor", name: "url", widget: "file", media_folder: "/assets/audio/migrated", public_folder: "assets/audio/migrated" }
      - label: "Fotogaléria"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Fotka", name: "url", widget: "image" }
      - label: "GPS súradnice (voliteľné)"
        name: "gps"
        widget: "object"
        required: false
        fields:
          - { label: "Zemepisná šírka (lat)", name: "lat", widget: "number", value_type: "float" }
          - { label: "Zemepisná dĺžka (lng)", name: "lng", widget: "number", value_type: "float" }
      - { label: "Vložená Google mapa (embed URL)", name: "mapEmbed", widget: "string", required: false, hint: "Adresa z Google Maps -> Zdieľať -> Vložiť mapu -> skopírovať len URL zo src=\"...\"." }

      - label: "SEO (voliteľné)"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        hint: "Ak nevyplníš, použije sa automaticky názov/popis/fotka zastavenia."
        fields:
          - { label: "SEO titulok", name: "title", widget: "string", required: false }
          - { label: "SEO popis", name: "description", widget: "text", required: false }
          - { label: "SEO obrázok (zdieľanie na sociálnych sieťach)", name: "image", widget: "image", required: false }

      - label: "Preklady obsahu"
        name: "i18n"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Angličtina"
            name: "en"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
              - { label: "Text", name: "text", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: [] }
              - label: "Audio (nahrávka v tomto jazyku)"
                name: "audio"
                widget: "list"
                required: false
                hint: "Nechaj prázdne, ak nahrávka v tomto jazyku nie je – prehrá sa slovenská."
                field: { label: "Audio súbor", name: "url", widget: "file", media_folder: "/assets/audio/migrated", public_folder: "assets/audio/migrated" }
          - label: "Čeština"
            name: "cs"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
              - { label: "Text", name: "text", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: [] }
              - label: "Audio (nahrávka v tomto jazyku)"
                name: "audio"
                widget: "list"
                required: false
                hint: "Nechaj prázdne, ak nahrávka v tomto jazyku nie je – prehrá sa slovenská."
                field: { label: "Audio súbor", name: "url", widget: "file", media_folder: "/assets/audio/migrated", public_folder: "assets/audio/migrated" }
          - label: "Maďarčina"
            name: "hu"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
              - { label: "Text", name: "text", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: [] }
              - label: "Audio (nahrávka v tomto jazyku)"
                name: "audio"
                widget: "list"
                required: false
                hint: "Nechaj prázdne, ak nahrávka v tomto jazyku nie je – prehrá sa slovenská."
                field: { label: "Audio súbor", name: "url", widget: "file", media_folder: "/assets/audio/migrated", public_folder: "assets/audio/migrated" }
          - label: "Nemčina"
            name: "de"
            widget: "object"
            required: false
            fields:
              - { label: "Názov", name: "nazov", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text", required: false }
              - { label: "Text", name: "text", widget: "markdown", required: false, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: [] }
              - label: "Audio (nahrávka v tomto jazyku)"
                name: "audio"
                widget: "list"
                required: false
                hint: "Nechaj prázdne, ak nahrávka v tomto jazyku nie je – prehrá sa slovenská."
                field: { label: "Audio súbor", name: "url", widget: "file", media_folder: "/assets/audio/migrated", public_folder: "assets/audio/migrated" }

      - { label: "Technické: ID (vyplniť len pri novom zastavení, potom nemeniť)", name: "id", widget: "string", hint: "Krátky identifikátor bez diakritiky a medzier, napr. 'hradna-studna'. Musí byť rovnaký ako názov súboru." }

  - name: kontakt
    label: "Kontakt"
    description: "Firemné a kontaktné údaje zobrazené na stránke Kontakt."
    files:
      - name: "kontakt"
        label: "Kontaktné údaje"
        file: "content/kontakt.json"
        format: "json"
        fields:
          - { label: "Firma", name: "firma", widget: "string" }
          - label: "Adresa"
            name: "adresa"
            widget: "list"
            field: { label: "Riadok adresy", name: "riadok", widget: "string" }
          - { label: "Telefón", name: "tel", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Web", name: "web", widget: "string" }
          - { label: "IČO", name: "ico", widget: "string" }
          - { label: "DIČ", name: "dic", widget: "string" }
          - { label: "IČ DPH", name: "icdph", widget: "string" }
          - label: "Sociálne siete"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
