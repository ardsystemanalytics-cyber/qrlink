<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR LINK – Správa obsahu</title>
  <meta name="robots" content="noindex">
  <!-- Natvrdo zadaná (absolútna) cesta ku config.yml – bez tohto sa pri
       otvorení adresy "/admin" bez lomítka na konci vie CMS pokúsiť
       stiahnuť config.yml zo zlého miesta a skončí to chybou 404. -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <link href="/admin/admin.css" rel="stylesheet">
</head>
<body>
  <script>
    // Predvolene zobraziť zoznamy ako KARTY s titulnou fotkou (Decap inak
    // začína textovým zoznamom bez fotiek). Ak si používateľ prepne na
    // zoznam ikonou vpravo hore, jeho voľba sa zapamätá a rešpektuje.
    try {
      if (!localStorage.getItem("decap-cms.entries.viewStyle")) {
        localStorage.setItem("decap-cms.entries.viewStyle", "VIEW_STYLE_GRID");
      }
    } catch (e) {}
  </script>
  <!-- Decap CMS (Git-based redakčný systém) – prihlásenie cez GitHub,
       zmeny sa ukladajú ako commity priamo do repozitára. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
